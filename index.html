<style>

.hero2 button.big{background:#fff;color:#0e4d64;border-color:#fff;padding:.8rem 1.8rem;font-size:1.05rem}
.site .grid.f,.site .panel{margin:1rem}.site .grid.f{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
@media(max-width:760px){.app{flex-direction:column}aside{width:auto;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center;gap:.4rem}aside nav{flex-direction:row;flex-wrap:wrap}.sp{margin:0 0 0 auto;flex-direction:row}.brand b{display:none}main{padding:1rem}}
@media print{aside,button,select,.np,.toast{display:none!important}.app{display:block}main{max-width:none;padding:0;animation:none}body{background:#fff;color:#000}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
const SB_URL="",SB_KEY="";   // Supabase > Project Settings > API: Project URL and anon (publishable) key
const SCHOOL="School Name",START="07:30";
const T={
en:{idlab:"Email, phone number or special ID",fmt:"Excel columns: Adm, Name, then one column per subject (Total and Position are optional).",nf2:"That is not one of your classes.",attn:"Attendance",pres:"Present",abs:"Absent",latee:"Late",allp:"All present",alla:"All absent",date:"Date",classes:"Classes",ctch:"Class teacher",room:"Room",cap:"Capacity",gn:"Guardian",gp:"Guardian phone",search:"Search (press Enter)",sure:"Delete this record?",rep:"Report card",prt:"Print report card",att_t:"Present today",dash:"Dashboard",cnt_l:"Total learners",cnt_c:"Classes",cnt_t:"Teachers",late_t:"Late today",byc:"By class",view:"View",app:"School Portal",login:"Log in",register:"Create account",email:"Email",pw:"Password",out:"Log out",upload:"Upload marks",learners:"Learners",teachers:"Teachers",myc:"My classes",cls:"Class",term:"Term",file:"Excel file (.xlsx)",check:"Check file",confirm:"Save to school records",adm:"Admission no.",name:"Name",code:"Special ID",add:"Add learner",save:"Save",edit:"Edit",marks:"Marks",total:"Total",pos:"Position",of:"out of",acad:"Academic progress",phys:"Physical progress",mind:"Mental wellbeing",late:"Late arrivals",none:"Nothing recorded yet.",link:"Link your child",linkhelp:"Enter the special ID you got from the school (example GSA001).",subj:"Class and subject",assign:"Teaching (Class:Subject, Class:Subject)",clock:"Clock in",ok:"Saved.",bad:"Problems found (these rows are skipped)",trend:"Total by term",up:"Improving",down:"Dropped",same:"Steady",lang:"Kiswahili",min:"min late",addt:"Add teacher",rows:"learners ready",lateadd:"Log late arrival",mins:"Minutes late",need:"Class, term and file are required.",nf:"Not found. Check the number and code."},
sw:{idlab:"Barua pepe, namba ya simu au kitambulisho maalum",fmt:"Safu za Excel: Adm, Name, kisha safu moja kwa kila somo (Total na Position si lazima).",nf2:"Hili si darasa lako.",attn:"Mahudhurio",pres:"Yupo",abs:"Hayupo",latee:"Amechelewa",allp:"Wote wapo",alla:"Wote hawapo",date:"Tarehe",classes:"Madarasa",ctch:"Mwalimu wa darasa",room:"Chumba",cap:"Uwezo",gn:"Mlezi",gp:"Simu ya mlezi",search:"Tafuta (bonyeza Enter)",sure:"Futa rekodi hii?",rep:"Kadi ya matokeo",prt:"Chapisha kadi ya matokeo",att_t:"Waliopo leo",dash:"Dashibodi",cnt_l:"Jumla ya wanafunzi",cnt_c:"Madarasa",cnt_t:"Walimu",late_t:"Waliochelewa leo",byc:"Kwa darasa",view:"Angalia",app:"Mfumo wa Shule",login:"Ingia",register:"Fungua akaunti",email:"Barua pepe",pw:"Nenosiri",out:"Toka",upload:"Pakia alama",learners:"Wanafunzi",teachers:"Walimu",myc:"Madarasa yangu",cls:"Darasa",term:"Muhula",file:"Faili ya Excel (.xlsx)",check:"Kagua faili",confirm:"Hifadhi kwenye rekodi za shule",adm:"Namba ya usajili",name:"Jina",code:"Kitambulisho maalum",add:"Ongeza mwanafunzi",save:"Hifadhi",edit:"Hariri",marks:"Alama",total:"Jumla",pos:"Nafasi",of:"kati ya",acad:"Maendeleo ya masomo",phys:"Maendeleo ya mwili",mind:"Ustawi wa akili",late:"Kuchelewa",none:"Hakuna rekodi bado.",link:"Unganisha mtoto wako",linkhelp:"Weka kitambulisho maalum ulichopewa na shule (mfano GSA001).",subj:"Darasa na somo",assign:"Anachofundisha (Darasa:Somo, Darasa:Somo)",clock:"Weka alama ya kufika",ok:"Imehifadhiwa.",bad:"Matatizo yamepatikana (safu hizi zimeachwa)",trend:"Jumla kwa muhula",up:"Anaboresha",down:"Ameshuka",same:"Thabiti",lang:"English",min:"dak. kuchelewa",addt:"Ongeza mwalimu",rows:"wanafunzi tayari",lateadd:"Rekodi kuchelewa",mins:"Dakika za kuchelewa",need:"Darasa, muhula na faili vinahitajika.",nf:"Haijapatikana. Angalia namba na msimbo."}};
let L=localStorage.lang||"en";const t=k=>T[L][k]||T.en[k]||k;
const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const key=s=>String(s).trim().replace(/\W+/g,"_"),dsp=s=>String(s).replace(/_/g," ");
let GC="";
const lvl=c=>{c=String(c||"").toLowerCase();const m=c.match(/(?:grade|gr|std|class)\s*(\d)/);if(m)return +m[1]>=7?"jun":"pri";return /pp|play|nursery|baby|pre/.test(c)?"pp":"pri"};
const KJ=[[90,"EE1"],[75,"EE2"],[58,"ME1"],[41,"ME2"],[31,"AE1"],[21,"AE2"],[11,"BE1"],[1,"BE2"]],KP=[[75,"EE"],[41,"ME"],[21,"AE"],[1,"BE"]];
const gr=p=>{if(S.cfg.grading=="abc")return p>=90?"A+":p>=80?"A":p>=70?"B":p>=60?"C":p>=50?"D":"F";const j=lvl(GC)=="jun",x=(j?KJ:KP).find(a=>p>=a[0]);return x?x[1]:(j?"BE2":"BE")};
const rc=()=>{let c;do{c=[...crypto.getRandomValues(new Uint8Array(5))].map(x=>"ABCDEFGHJKMNPQRSTUVWXYZ23456789"[x%31]).join("")}while(!/[A-Z]/.test(c));return c};
document.documentElement.dataset.theme=localStorage.theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");
const thI=()=>document.documentElement.dataset.theme=="dark"?"☀":"☾",setTh=()=>{const n=document.documentElement.dataset.theme=="dark"?"light":"dark";document.documentElement.dataset.theme=n;localStorage.theme=n;render()};
const pfx=()=>(S.cfg.prefix||String(sn()).split(/\s+/).filter(Boolean).map(w=>w[0]).join("").slice(0,3)||"SCH").toUpperCase().replace(/[^A-Z0-9]/g,"");
function nextCodes(n){const p=pfx(),re=new RegExp("^"+p+"(\\d+)$");let m=0;S.learners.forEach(l=>{const x=re.exec(l.id);if(x)m=Math.max(m,+x[1])});return Array.from({length:n},(_,i)=>p+String(m+i+1).padStart(3,"0"))}
const today=()=>new Date().toISOString().slice(0,10);
const DOM="@parent.school.app",kind=v=>v.includes("@")?"email":/^[\d\s+()-]{7,}$/.test(v)?"phone":"id";
const mail=v=>{v=v.trim();const k=kind(v);return k=="email"?v.toLowerCase():(k=="phone"?"p"+v.replace(/\D/g,""):"id"+v.toLowerCase().replace(/[^\w-]/g,""))+DOM};
const S={home:1,land:1,cfg:{},cfgRow:false,classes:[],ac:"",ad:"",q:"",u:null,role:null,tab:null,learners:[],teachers:[],sheet:null,msg:"",edit:null,term:"",ai:0,me:null};
let auth,db,sb;
function ranks(a){const s=[...a].sort((x,y)=>y.total-x.total);let p=0,last=null;s.forEach((o,i)=>{if(o.total!==last){p=i+1;last=o.total}o.pos=p})}
function note(m){S.msg=esc(m);render()}
function setLang(){L=L=="en"?"sw":"en";localStorage.lang=L;document.documentElement.lang=L;render()}

const ICON='<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/><circle cx="12" cy="11" r="1.6"/><path d="M12 12.6V15"/></svg>';
function loginV(){if(S.who=="parent"&&S.reg)return regV();return `<label>${t("idlab")}<input id="em" autocomplete="username" placeholder="name@mail.com / 0712345678 / ${esc(pfx())}001"></label><label>${t("pw")}<input id="pw" type="password" autocomplete="current-password"></label><button class="p w" onclick="go(0)">${t("login")}</button><p class="c"><button class="lk" onclick="${S.who=="parent"?"S.reg=1;render()":"go(1)"}">${t("register")}</button></p>`}
function regV(){return `<h2>${t("regp")}</h2><label>${t("code")}<input id="rc" placeholder="${esc(pfx())}001" autocapitalize="characters"></label><label>${t("myph")}<input id="rp" type="tel" placeholder="0712345678"></label><p class="sub">${t("rhelp")}</p><label>${t("idlab")}<input id="rl" autocomplete="username" placeholder="name@mail.com / 0712345678"></label><label>${t("pw")}<input id="rw" type="password" autocomplete="new-password"></label><button class="p w" onclick="goReg()">${t("register")}</button><p class="c"><button class="lk" onclick="S.reg=0;render()">${t("login")}</button></p>`}
async function goReg(){const g=i=>$(i).value.trim(),code=g("#rc").toUpperCase(),ph=g("#rp"),id=g("#rl")||ph,pw=$("#rw").value;if(!code||!ph||!id||pw.length<6)return note(t("need"));S.pend={code,ph};S.reg=0;try{await auth.createUserWithEmailAndPassword(mail(id),pw)}catch(x){S.pend=null;S.reg=1;note(x.message)}}
async function go(reg){const v=$("#em").value.trim(),p=$("#pw").value;S.pend=null;
 try{reg?await auth.createUserWithEmailAndPassword(mail(v),p):await auth.signInWithEmailAndPassword(mail(v),p)}catch(x){S.pend=null;note(x.message)}}

async function load(){const c=db.collection("learners"),q=S.role==="parent"?c.where("parents","array-contains",S.u.uid):c;
 S.learners=(await q.get()).docs.map(d=>({id:d.id,...d.data()}));
 S.learners.sort((a,b)=>(a.cls+a.name).localeCompare(b.cls+b.name));
 if(S.role==="admin"){S.teachers=(await db.collection("teachers").get()).docs.map(d=>({id:d.id,...d.data()}))}if(S.role!=="parent")S.classes=(await db.collection("classes").get()).docs.map(d=>({id:d.id,...d.data()}))}

/* ---------- admin: upload ---------- */
function upV(){const cl=[...new Set(S.learners.map(l=>l.cls))];
 return `<h1>${t("upload")}</h1><div class="row"><label>${t("cls")}<input id="uc" list="cl" placeholder="Grade 5"></label><datalist id="cl">${cl.map(c=>`<option value="${esc(c)}">`).join("")}</datalist><label>${t("term")}<input id="ut" placeholder="Term 1 2026"></label></div><label>${t("file")}<input id="uf" type="file" accept=".xlsx,.xls,.csv"></label><p><button class="p" onclick="check()">${t("check")}</button> <button onclick="tpl()">${t("tpl")}</button></p>`+(S.sheet?sheetV():"")}
async function check(){const f=$("#uf").files[0],cls=$("#uc").value.trim(),term=key($("#ut").value);
 if(!f||!cls||!term)return note(t("need"));
 if(S.role==="teacher"&&!(S.me.assign||[]).some(a=>a.cls===cls))return note(t("nf2"));
 const wb=XLSX.read(await f.arrayBuffer()),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""});
 const ks=Object.keys(rows[0]||{}),K=re=>ks.find(k=>re.test(k)),ka=K(/adm|usajili/i),kn=K(/name|jina/i),kt=K(/total|jumla/i),kp=K(/pos|nafasi/i),subs=ks.filter(k=>![ka,kn,kt,kp].includes(k));
 const bad=[],seen=new Set(),ok=[],cr=S.classes.find(c=>c.name===cls),req=(cr?.subj||"").split(",").map(x=>x.trim()).filter(Boolean),miss=req.filter(x=>!subs.some(k=>key(k)===key(x)));
 if(!ka||!kn||!subs.length)bad.push("Columns needed: Adm, Name, and one column per subject.");
 else if(miss.length)bad.push("Missing subject columns for "+cls+": "+miss.join(", "));
 else rows.forEach((r,i)=>{const n=i+2,adm=String(r[ka]).trim().replace(/\W/g,""),nm=String(r[kn]).trim();
  if(!adm||!nm)return bad.push(`Row ${n}: missing admission number or name`);
  if(seen.has(adm))return bad.push(`Row ${n}: duplicate ${adm}`);seen.add(adm);
  const ex=S.learners.find(l=>l.cls===cls&&(l.id.toUpperCase()===adm.toUpperCase()||l.adm===adm||l.name.toLowerCase()===nm.toLowerCase()));
  if(S.role==="teacher"&&!ex)return bad.push(`Row ${n}: ${nm} not found in ${cls}`);
  const m={};let sum=0,fine=true;
  subs.forEach(s=>{const v=r[s];if(v==="")return;const x=Number(v);if(isNaN(x)||x<0||x>100){bad.push(`Row ${n}: ${s} must be 0–100`);fine=false}else{m[key(s)]=x;sum+=x}});
  req.forEach(x=>{const k=subs.find(z=>key(z)===key(x));if(k&&r[k]===""){bad.push(`Row ${n}: ${x} is empty`);fine=false}});if(kt&&r[kt]!==""&&Number(r[kt])!==sum){bad.push(`Row ${n}: total ${r[kt]} does not match marks (${sum})`);fine=false}
  if(fine)ok.push({id:ex?.id,adm:ex?.adm||adm,name:nm,subjects:m,total:sum,pos:kp&&r[kp]!==""?Number(r[kp]):0})});
 if(ok.length&&!kp)ranks(ok);
 S.sheet={cls,term,ok,bad};render()}
function sheetV(){const s=S.sheet;
 return `<h2>${s.ok.length} ${t("rows")}</h2>`+(s.bad.length?`<p class="bad"><b>${t("bad")}</b></p>`+s.bad.slice(0,15).map(x=>`<p class="bad">${esc(x)}</p>`).join(""):"")+(s.ok.length?`<div class="wrap"><table><tr><th>${t("adm")}<th>${t("name")}<th>${t("total")}<th>${t("pos")}</tr>${s.ok.slice(0,8).map(o=>`<tr><td>${esc(o.adm)}<td>${esc(o.name)}<td>${o.total}<td>${o.pos}</tr>`).join("")}</table></div><p><button class="p" onclick="saveSheet()">${t("confirm")}</button></p>`:"")}
async function saveSheet(){const{cls,term,ok}=S.sheet;
 if(S.role==="teacher"){const{error}=await sb.from("submissions").insert({id:Date.now()+rc(),cls,term,sender:S.u.email,rows:ok});S.sheet=null;return error?note(error.message):note(t("sent"))}
 await publish(cls,term,ok);S.sheet=null;await load();S.tab="lr";note(t("ok"))}
async function publish(cls,term,ok){const b=db.batch(),col=db.collection("learners"),cs=nextCodes(ok.filter(o=>!o.id).length);let i=0;

function readLogo(f){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,240/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);res(c.toDataURL("image/png"))};i.src=r.result};r.readAsDataURL(f)})}
async function saveCfg(skip){const g=i=>$(i)?$(i).value.trim():"",c={...S.cfg};
 if(!skip){c.name=g("#sn")||c.name||SCHOOL;c.motto=g("#sm");c.about=g("#sa");c.about_sw=g("#sx");c.phone=g("#sp");c.email=g("#se");c.start=g("#ss")||c.start;{const pv=g("#sf").toUpperCase().replace(/[^A-Z0-9]/g,"");if(pv&&pv!==pfx())c.prefix=pv;else if(!S.cfg.prefix)delete c.prefix}c.grading=g("#sg")||"knec";c.levels=g("#sv");const f=$("#sl")&&$("#sl").files[0];if(f)c.logo=await readLogo(f);if(S.rmlogo)delete c.logo}
 S.rmlogo=0;const{error}=await sb.from("settings").upsert({id:"school",data:c});if(error)return note(error.message);
 S.cfg=c;S.cfgRow=true;S.first=0;S.tab="dash";document.title=sn();render();note(t("ok"))}

function lpV(){const cs=[...new Set((S.me.assign||[]).map(a=>a.cls))],c=cs.includes(S.lc)?S.lc:cs[0];S.lc=c;
 if(S.vw){const l=S.learners.find(x=>x.id==S.vw);if(l)return `<p class="np"><button onclick="S.vw=null;render()">← ${t("back")}</button></p>`+kidV(l)+editV(l)}
 return `<h1>${t("lprog")}</h1><label>${t("cls")}<select onchange="S.lc=this.value;render()">${cs.map(x=>`<option ${x==c?"selected":""}>${esc(x)}</option>`).join("")}</select></label><div class="grid">${S.learners.filter(l=>l.cls===c).map(l=>{GC=l.cls;const ts=Object.keys(l.results||{}).sort(),r=l.results[ts[ts.length-1]],a=r?avgR(r):0;return `<button class="card lk2" onclick="S.vw='${l.id}';render()"><span class="av">${ini(l.name)}</span><b>${esc(l.name)}</b><small>${r?`${a}% ${gr(a)} · #${r.pos||"-"}`:t("none")}</small></button>`}).join("")}</div>`}
function kidV(l){GC=l.cls;const R=l.results||{},ts=Object.keys(R).sort(),cur=R[key(S.term)]?key(S.term):ts[ts.length-1],r=R[cur],pv=R[ts[ts.indexOf(cur)-1]],n=l.notes||{},A=Object.values(l.att||{}),pa=A.length?Math.round(A.filter(x=>x!="A").length/A.length*100):null,sb2=Object.entries(r?.subjects||{}).sort((a,b)=>b[1]-a[1]),a=r?avgR(r):0,mx=Math.max(...ts.map(k=>R[k].total),1);
 return `<div class="hd"><span class="av big">${ini(l.name||"?")}</span><div><h1>${esc(l.name)}</h1><p>${esc(l.cls)} · ${t("adm")} ${esc(l.adm)}${[l.mn,l.fn,l.gn].filter(Boolean).length?" · "+[l.mn,l.fn,l.gn].filter(Boolean).map(esc).join(" & "):""}</p></div></div>`
 +(r?`<label class="np">${t("term")}<select onchange="S.term=this.value;render()">${ts.map(k=>`<option value="${k}" ${k==cur?"selected":""}>${esc(dsp(k))}</option>`).join("")}</select></label>
<div class="tiles"><div class="tile"><small>${t("pos")}</small><b>${r.pos||"-"}</b> <span>${t("of")} ${r.n||"-"}</span></div><div class="tile"><small>${t("avg")}</small><b>${a}%</b> <span class="chip ${gc(a)}">${gr(a)}</span></div><div class="tile"><small>${t("total")}</small><b>${r.total}</b></div><div class="tile"><small>${t("attp")}</small><b>${pa==null?"-":pa+"%"}</b></div></div>
${sb2.length?`<p class="hl">${t("best")}: <b>${esc(dsp(sb2[0][0]))}</b> (${sb2[0][1]}) · ${t("weak")}: <b>${esc(dsp(sb2[sb2.length-1][0]))}</b> (${sb2[sb2.length-1][1]})</p>`:""}
<h2>${t("marks")}</h2><div class="grid">${sb2.map(([s,v])=>{const o=pv?.subjects?.[s],d=o==null?null:v-o;return `<div class="card"><small>${esc(dsp(s))}</small><b>${v}</b> <span class="chip ${gc(v)}">${gr(v)}</span><span class="bar" style="width:${v}%"></span>${d==null?"":`<small class="${d>=0?"up":"dn"}">${d>0?"▲":d<0?"▼":"■"} ${Math.abs(d)}</small>`}</div>`}).join("")}</div>
<h2>${t("trend")}</h2>${ts.map(k=>`<div class="tr"><span>${esc(dsp(k))}</span><span class="bar" style="width:${R[k].total/mx*100}%"></span><b>${R[k].total}${R[k].pos?` · #${R[k].pos}`:""}</b></div>`).join("")}`:`<p>${t("none")}</p>`)
 +`<h2>${t("comm")}</h2><div class="grid">${["acad","phys","mind"].map(k=>`<div class="card"><small>${t(k)}</small><p>${n[k]?esc(n[k]):t("none")}</p></div>`).join("")}</div>`
 +attR(l)+`<h2>${t("late")}: ${(l.late||[]).length}</h2>`+(l.late||[]).slice(-5).map(x=>`<p>${esc(x.d)}: ${x.m} ${t("min")}</p>`).join("")+`<p class="np"><button class="p" onclick="window.print()">${t("prt")}</button></p>`}

/* ---------- Supabase adapter ---------- */
const PK={learners:"id",teachers:"email",classes:"id"};
const DEF={learners:()=>({adm:"",name:"",cls:"",code:"",gn:"",gp:"",mn:"",mp:"",me:"",fn:"",fp:"",fe:"",parents:[],results:{},notes:{},late:[],att:{}}),teachers:()=>({name:"",phone:"",assign:[],clock:null}),classes:()=>({name:"",teacher:"",room:"",cap:"",subj:""})};
const AU=x=>({__au:x}),cl=x=>JSON.parse(JSON.stringify(x??null));
function setP(o,path,v){const p=path.split(".");let c=o;for(const k of p.slice(0,-1))c=c[k]=c[k]&&typeof c[k]=="object"?c[k]:{};c[p[p.length-1]]=v}
function mrg(a,b){for(const k in b){const v=b[k];a[k]=v&&typeof v=="object"&&!Array.isArray(v)?mrg(a[k]&&typeof a[k]=="object"&&!Array.isArray(a[k])?a[k]:{},v):v}return a}
function apply(row,upd,ch){for(const[k,v]of Object.entries(upd)){const top=k.split(".")[0];ch.add(top);
 if(v&&v.__au){const a=Array.isArray(row[top])?row[top]:[];row[top]=a.some(y=>JSON.stringify(y)==JSON.stringify(v.__au))?a:[...a,v.__au]}
 else if(k.includes(".")){row[top]=cl(row[top])||{};setP(row,k,v)}else row[k]=v}}
async function run(ops){const by={};ops.forEach(o=>(by[o.c]=by[o.c]||[]).push(o));
 for(const c in by){const pk=PK[c],ids=[...new Set(by[c].map(o=>o.id))];
  const{data,error}=await sb.from(c).select("*").in(pk,ids);if(error)throw error;
  const cur={},ch={},del=[],ins=new Set();(data||[]).forEach(r=>cur[r[pk]]=r);
  for(const o of by[c]){if(o.k=="del"){del.push(o.id);continue}
   let row=cur[o.id];if(!row){if(o.k=="upd")throw new Error("Record not found");row=cur[o.id]={...DEF[c](),[pk]:o.id};ins.add(o.id)}
   const st=ch[o.id]=ch[o.id]||new Set();
   if(o.k=="set"){mrg(row,o.d);Object.keys(o.d).forEach(k=>st.add(k))}else apply(row,o.d,st)}
  const jobs=[],rows=[...ins].map(id=>cur[id]);
  if(rows.length)jobs.push(sb.from(c).insert(rows));
  Object.keys(ch).filter(id=>!ins.has(id)).forEach(id=>{const u={};ch[id].forEach(k=>u[k]=cur[id][k]);jobs.push(sb.from(c).update(u).eq(pk,id))});
  if(del.length)jobs.push(sb.from(c).delete().in(pk,del));
  for(const r of await Promise.all(jobs))if(r.error)throw r.error}}
function mkdb(){const doc=(c,id)=>({c,id,
  async get(){const{data,error}=await sb.from(c).select("*").eq(PK[c],id).maybeSingle();if(error)throw error;return{exists:!!data,id,data:()=>data||undefined}},
  set:(d)=>run([{c,id,k:"set",d}]),update:d=>run([{c,id,k:"upd",d}]),delete:()=>run([{c,id,k:"del"}])});
 const coll=(c,f)=>({doc:id=>doc(c,id),where:(fl,op,v)=>coll(c,q=>q.contains(fl,[v])),async get(){let q=sb.from(c).select("*");if(f)q=f(q);const{data,error}=await q;if(error)throw error;return{docs:(data||[]).map(r=>({id:r[PK[c]],data:()=>r}))}}});
 return{collection:c=>coll(c),batch:()=>{const ops=[];return{set(r,d){ops.push({c:r.c,id:r.id,k:"set",d})},update(r,d){ops.push({c:r.c,id:r.id,k:"upd",d})},delete(r){ops.push({c:r.c,id:r.id,k:"del"})},commit:()=>run(ops)}}}}
function mkauth(){let last;const mk=u=>u&&{uid:u.id,email:u.email};
 return{createUserWithEmailAndPassword:async(e,p)=>{const{data,error}=await sb.auth.signUp({email:e,password:p});if(error)throw error;if(!data.session)throw new Error("Turn OFF Confirm email in Supabase: Authentication > Providers > Email.")},
 signInWithEmailAndPassword:async(e,p)=>{const{error}=await sb.auth.signInWithPassword({email:e,password:p});if(error)throw error},
 signOut:()=>sb.auth.signOut(),
 onAuthStateChanged:cb=>sb.auth.onAuthStateChange((ev,ses)=>{const id=ses?.user?.id||null;if(ev=="TOKEN_REFRESHED"||id===last)return;last=id;setTimeout(()=>cb(mk(ses?.user)),0)})}}

document.documentElement.lang=L;
if(!SB_KEY){app.innerHTML=shell("<p>Add your Supabase URL and key at the top of this file (SB_URL and SB_KEY).</p>")}
else{sb=supabase.createClient(SB_URL,SB_KEY);auth=mkauth();db=mkdb();window.cfgP=sb.from("settings").select("data").eq("id","school").maybeSingle().then(({data})=>{S.cfg=data?.data||{};S.cfgRow=!!data;document.title=sn();render()});
 auth.onAuthStateChanged(async u=>{S.u=u;S.msg="";if(!u){S.role=null;S.land=1;S.home=1;return render()}
  try{await window.cfgP;const em=u.email.toLowerCase();
   if((await sb.rpc("is_admin")).data===true)S.role="admin";
   else{const d=await db.collection("teachers").doc(em).get();S.role=d.exists?"teacher":"parent";S.me=d.data()}
   await load();if(S.role==="parent"&&!S.learners.length&&S.pend){const v=S.pend;S.pend=null;if(!await linkId(v.code,v.ph,1))S.lf=1}S.tab=S.role==="admin"&&!S.cfgRow?(S.first=1,"set"):{admin:"dash",teacher:"my",parent:"kid"}[S.role];render();if(S.lf){S.lf=0;note(t("nf"))}}catch(x){note(x.message)}});
 render()}
